<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .c1 { color: brown; }
</style>

<script src="https://code.jquery.com/jquery-3.7.1.slim.min.js" integrity="sha256-kmHvs0B+OpCW5GVHUNjv9rOmY0IvSIRcf7zGUDTDQM8=" crossorigin="anonymous"></script>
<script>
    $(document).ready(function(){
        $('button').click(function(){
            $('h1').css('color', 'red');
            $('p').css('backgroundColor', 'yellow');
            $('img').attr('src', 'http://placehold.co/300x300');
            $('#t1').text('<a href="http://www.syu.ac.kr">text()</a>');
            $('#t2').html('<a href="http://www.syu.ac.kr">html()</a>');
            $('#t1').toggleClass('c1');
        });
    });
</script>
<body>
    <h1>jQuery 예제</h1>
    <p>삼육대학교</p>
    <p id="t1">인공지능융합학부</p>
    <p id="t2">웹프로그래밍</p>
    <img><br>
    <img src="https://placehold.co/100x100"><br> <!--빈이미지 레이아웃-->
    <button>클릭하세요.</button>
</body>
</html>
