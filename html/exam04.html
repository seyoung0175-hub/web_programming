<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>목록</title>
</head>
<body>
   <h1>글머리 기호 목록</h1>
   <ul type="circle">
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
   </ul>
   <h1>순서 번호 목록</h1>
   <ol type="i" start="4">
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
   </ol>
   <h1>정의 목록</h1>
   <dl>
      <dt>프론트엔드</dt>
      <dd>HTML</dd>
      <dd>CSS</dd>
      <dd>JavaScript</dd>
      <dt>백엔드</dt>
      <dd>Node.js</dd>
      <dd>MySQL</dd>
   </dl>
</body>
</html>
