<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1&family=Grandiflora+One&display=swap" rel="stylesheet">
<style>
    body { 
        background-color: black;
    }
    .gothic-a1-regular {
  font-family: "Gothic A1", sans-serif;
  font-weight: 400;
  font-style: normal;
}
    table { 
        width: 85%; 
        margin: auto;  
    }
    th { 
        background-color: #202020;
        color: white;
        height: 50px;
        border: 1px solid #222222;
        font-size: 18px;
    }
    td {
        color: white;
        height: 60px;
        border: 1px solid #222222;
    }
    .python {
        background-color: #7383a3;
    }
    .nojak {
        background-color: #B09E99
    }
    .web {
        background-color: #649EA6;
    }
    .db {
        background-color: #6E7E80;
    }
    .org {
        background-color: #8690A1;
    }
    .senior {
        background-color: #8CA7B6;
    }
    .thinking {
        background-color: #89ACAE;
    }
    .python, .web, .db, .org, .senior, .thinking, .nojak {
        font-weight: 600;
        font-size: 18px;
        border: 1px solid #222222;
    }
    .time {
        font-size: 16px;
    }
    .time-title {
        background-color: #151515;
        width: 8%;
    }
    .day {
        width: 18%;
    }
</style>
<body class="gothic-a1-regular">
    <table border="1">

            <th class="day">목</th>

        </tr>
        <tr>
            <td class="time">9</td>
            <td rowspan="3" class="python">Python</td>
            <td rowspan="3" class="web">웹프로그래밍</td>
            <td></td>
            <td rowspan="3" class="db">데이터베이스 설계</td>
            <td></td>
        </tr>
        <tr>
            <td class="time">10</td>
            <td></td>
            <td rowspan="3" class="org">조직행동론</td>
        </tr>
        <tr>
            <td class="time">11</td>
            <td></td>
        </tr>
        <tr>
            <td class="time">12</td>
            <td></td>
            <td rowspan="3" class="senior">노인체육론</td>
            <td></td>

        </tr>
        <tr>
            <td class="time">1</td>
            <td></td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <td class="time">2</td>
            <td></td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <td class="time">3</td>
            <td rowspan="2" class="nojak">노작</td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <td class="time">4</td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <td class="time">5</td>
            <td></td>
            <td></td>

            <td></td>
            <td></td>
        </tr>

</html>
