<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>구구단</h1>

    <script>
        let i = 2;
        let j = 1;

        for (i = 2; i <= 9; i++) {
            document.write(i + "단<br>");

            for (j = 1; j <= 9; j++) {
                document.write(i + " x " + j + " = " + (i * j) + "<br>");
            }

            document.write("<br>");
        }
    </script>
</body>
</html>
